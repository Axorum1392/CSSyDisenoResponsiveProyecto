name: Mi Practica de CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Env'
        required: true
        default: 'qa'
        type: choice
        options:
          - stage
          - qa
          - production
jobs:
  mi-tarea-de-prueba:
    runs-on: ubuntu-latest # El sistema operativo del robot

    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4 # Acción oficial para "clonar" tu propio repo

      - name: Saludar al sistema
        run: echo "Hola, el proceso de CI ha comenzado correctamente."

      - name: Simular instalación
        run: |
          echo "Instalando dependencias imaginarias..."
          sleep 2
          echo "Todo listo."

      - name: Simular Test
        run: echo "Ejecutando tests... ¡Pasaron al 100%! ✅"
